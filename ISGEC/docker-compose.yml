services:
  backend:
    build: ./backend
    container_name: adv-backend
    ports:
      - "${ISGEC_BACKEND_PORT:-8001}:8001"
    environment:
      DATABASE_URL: sqlite:////data/isgec.db
      DATA_DIR: /data
      UPLOAD_DIR: /uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - backend_data:/data
      - backend_uploads:/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: adv-frontend
    ports:
      - "${ISGEC_FRONTEND_PORT:-3001}:3001"
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8001}
    depends_on:
      - backend
    restart: unless-stopped

  # Optional: self-hosted LLM for on-prem deployments (zero-API).
  # Uncomment to use — set LLM_PROVIDER=ollama in your shell.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: adv-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
  # ollama_models:
