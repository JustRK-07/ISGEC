[project]
name = "adv-backend"
version = "0.1.0"
description = "Agentic Drawing Validator — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "alembic>=1.13.0",
    "aiofiles>=24.1.0",
    "httpx>=0.27.0",
    "ezdxf>=1.3.0",
    "shapely>=2.0.6",
    "numpy>=1.26.0",
    "rapidfuzz>=3.10.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "fastapi>=0.115.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "shapely>=2.0.6",
    "rapidfuzz>=3.10.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
