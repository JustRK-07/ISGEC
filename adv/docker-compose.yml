version: "3.9"

services:
  backend:
    build: ./backend
    container_name: adv-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/adv.db
      DATA_DIR: /data
      UPLOAD_DIR: /uploads
      CORS_ORIGINS: http://localhost:3000
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - backend_data:/data
      - backend_uploads:/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: adv-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  # Optional: self-hosted LLM for on-prem deployments (zero-API).
  # Uncomment to use — set LLM_PROVIDER=ollama in your shell.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: adv-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
  # ollama_models:
